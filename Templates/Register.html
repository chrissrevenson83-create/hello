<!DOCTYPE html>
<html lang="vi">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta charset="UTF-8">
  <title>Đăng ký</title>
  <style>
    body { font-family: sans-serif; background: #1a56db;
           display: flex; align-items: center;
           justify-content: center; min-height: 100vh; }
    .card { background: white; padding: 2rem;
            border-radius: 12px; width: 360px; }
    h2 { text-align: center; margin-bottom: 1.5rem; color: #1a56db; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd;
            border-radius: 8px; margin-bottom: 1rem; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #1a56db;
             color: white; border: none; border-radius: 8px;
             font-size: 14px; cursor: pointer; }
    .error { color: red; font-size: 13px; text-align: center; margin-bottom: 1rem; }
    .link { text-align: center; margin-top: 1rem; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Đăng ký</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Tên đăng nhập" required>
      <input type="password" name="password" placeholder="Mật khẩu" required>
      <button type="submit">Đăng ký</button>
    </form>
    <p class="link">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
  </div>
</body>
</html>
